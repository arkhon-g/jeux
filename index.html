<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes jeux</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --ink: #f4f4f4; --muted: #9b9b9b; --line: #3a3a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 600 1rem/1.45 system-ui, sans-serif; }
  main { max-width: 540px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 2rem; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a { display: block; padding: 16px 18px; border: 2px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none; }
  a:hover, a:focus-visible { border-color: #fff; outline: none; }
  small { display: block; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Mes jeux</h1>
  <p>Petits jeux et outils à ouvrir sur le téléphone.</p>
  <ul>
    <li><a href="des-histoires/">Dés histoires<small>Lance les dés et invente une histoire avec les symboles.</small></a></li>
    <!-- Pour ajouter une appli : un dossier avec son index.html, puis une ligne <li> comme celle du dessus. -->
  </ul>
</main>
</body>
</html>
